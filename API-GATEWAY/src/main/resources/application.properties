server.port=8080
spring.application.name=API-GATEWAY

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Spring Cloud Gateway MVC Routes

# 1. Auth Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# 2. Booking Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=booking-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://book-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/bookings/**

# 3. Vehicle Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=vehicle-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://book-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/vehicles/**

# 4. Record Service Route
spring.cloud.gateway.server.webmvc.routes[3].id=record-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://record-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/records/**

# 5. Billing Service Route
spring.cloud.gateway.server.webmvc.routes[4].id=billing-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://bill-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/billing/**
